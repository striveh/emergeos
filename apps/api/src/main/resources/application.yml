spring:
  application:
    name: emerge-api
  datasource:
    url: ${EMERGE_DB_URL}
    username: ${EMERGE_DB_USER}
    password: ${EMERGE_DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  address: 127.0.0.1
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  emerge:
    maturity: research-prototype
    capture-persistence: postgresql
    manifestation-side-effects: local-memory-only

emerge:
  prototype:
    principal-id: local-user
