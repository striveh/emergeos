spring:
  application:
    name: emerge-api
  datasource:
    url: ${EMERGE_DB_URL}
    username: ${EMERGE_DB_USER}
    password: ${EMERGE_DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  address: 127.0.0.1
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,stage1Durability
          show-details: always

info:
  emerge:
    maturity: research-prototype
    capture-persistence: postgresql
    artifact-lineage-persistence: postgresql
    action-attempt-persistence: postgresql
    action-provider: simulated-loopback-only
    agent-kernel: framework-free-scripted-fake
    agent-trace: response-only
    manifestation-side-effects: local-memory-only

emerge:
  prototype:
    principal-id: local-user
  simulated-provider:
    base-url: http://127.0.0.1:1
    connector: simulated.local-draft
    audience: adapter:simulated-provider
    account-ref: simulated-account:${emerge.prototype.principal-id}
    request-timeout: PT0.5S
    capability-ttl: PT5M
    max-provider-calls: 2
