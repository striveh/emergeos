<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>快速捕获 · EmergeOS</title>
    <link rel="stylesheet" href="/capture/quick-capture.css">
    <script src="/capture/quick-capture.js" defer></script>
  </head>
  <body>
    <main class="capture-shell">
      <header class="capture-heading">
        <p class="eyebrow">EmergeOS · Quick Capture</p>
        <h1>记下此刻</h1>
        <p class="intro">先保存原始想法，再决定它将走向哪里。</p>
      </header>

      <form
        id="quick-capture-form"
        class="capture-card"
        action="/api/v1/captures"
        method="post"
        autocomplete="off"
        aria-describedby="capture-status"
      >
        <div class="field-stack">
          <label for="capture-content">你看见或想到什么？</label>
          <textarea
            id="capture-content"
            name="content"
            rows="8"
            maxlength="12000"
            placeholder="写下事实、线索或刚刚冒出的念头……"
            required
          ></textarea>
        </div>

        <fieldset>
          <legend>来源类型</legend>
          <div class="source-options">
            <div class="source-option">
              <input
                id="source-text"
                name="sourceType"
                type="radio"
                value="TEXT"
                checked
              >
              <label for="source-text">文字</label>
            </div>
            <div class="source-option">
              <input
                id="source-link"
                name="sourceType"
                type="radio"
                value="LINK"
              >
              <label for="source-link">链接</label>
            </div>
          </div>
        </fieldset>

        <div id="link-source-field" class="field-stack" hidden>
          <label for="source-ref">原始链接</label>
          <input
            id="source-ref"
            name="sourceRef"
            type="url"
            inputmode="url"
            autocomplete="url"
            placeholder="https://example.com/…"
          >
        </div>

        <div class="capture-actions">
          <div class="action-buttons">
            <button id="capture-submit" type="submit">保存这条想法</button>
            <button id="capture-abandon-retry" class="secondary-action" type="button" hidden>
              放弃重试，继续编辑
            </button>
            <button id="capture-new-entry" class="secondary-action" type="button" hidden>
              开始新条目
            </button>
          </div>
          <div
            id="capture-status"
            class="status"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            tabindex="-1"
            data-state="READY"
          >
            <strong class="status-code">READY</strong>
            <span class="status-message">内容只会提交到当前 EmergeOS 实例。</span>
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
