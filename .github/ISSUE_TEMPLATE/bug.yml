name: Bug report
description: Report a reproducible product or engineering defect
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe observable behavior without including private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Include commands, versions and a minimal synthetic example.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I confirm this report contains no credentials, real user data, private prompts or complete real traces.
          required: true

