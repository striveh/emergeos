name: Feature or design proposal
description: Propose a user outcome, architecture improvement or contribution
title: "[Proposal] "
labels: ["proposal", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: Start with the unmet outcome, not a preferred framework.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How could we prove or disprove it?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I confirm this proposal contains no credentials or real user data.
          required: true

